<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Admin SC+ Talent &amp; Sports</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin.js"></script>
</head>
<body class="login" data-page="login">
  <main class="login__box">
    <img class="login__logo" src="../assets/img/logo/horizontal-sombre.webp" alt="SC+ Talent & Sports" width="855" height="160">
    <h1>Espace administration</h1>
    <form class="form" data-login novalidate>
      <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
      <label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn--light" type="submit">Se connecter</button>
      <p class="msg" data-msg role="status"></p>
    </form>
    <a class="retour" href="../index.html">← Retour au site</a>
  </main>
</body>
</html>
