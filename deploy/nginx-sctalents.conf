# Vhost nginx du site SC+ Talent & Sports. Le HTTPS est ajouté par certbot.
server {
    listen 80;
    server_name sctalents.169-58-85-222.sslip.io;

    # vidéos envoyées depuis l'espace admin : jusqu'à 600 Mo
    client_max_body_size 600M;
    client_body_timeout 600s;

    location /static/ {
        alias /opt/sctalents/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/sctalents/donnees/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8240;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
